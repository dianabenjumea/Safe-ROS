# Local costmap parameters for agent/move_base
global_frame: odom
robot_base_frame: base_link

# Frequencies
update_frequency: 20.0      # Hz
publish_frequency: 5.0      # Hz

# Rolling window
static_map: false
rolling_window: true
width: 20                    # number of cells (local window)
height: 20                   # number of cells
resolution: 0.05             # meters per cell
origin: [0.0, 0.0, 0.0]      # local costmap origin (ignored in rolling window)

# Obstacle & inflation layers
plugins:
  - {name: obstacles_laser, type: "costmap_2d::ObstacleLayer"}
  - {name: inflation, type: "costmap_2d::InflationLayer"}

# Footprint
footprint: [[-0.21, -0.165], [-0.21, 0.165], [0.21, 0.165], [0.21, -0.165]]
inflation_radius: 0.3
observation_sources: scan
scan:
  data_type: LaserScan
  topic: scan
  marking: true
  clearing: true
