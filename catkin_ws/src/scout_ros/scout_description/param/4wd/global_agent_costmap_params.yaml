# Global costmap parameters for agent/move_base
global_frame: map
robot_base_frame: base_link

# Frequencies
update_frequency: 5.0       # Hz
publish_frequency: 1.0      # Hz

# Map settings
static_map: true
rolling_window: false
width: 200                  # number of cells
height: 200                 # number of cells
resolution: 0.05            # meters per cell
origin: [-5.0, -5.0, 0.0]  # map coordinates of bottom-left corner (center at 0,0)

# Robot footprint & inflation
plugins:
  - {name: obstacles_laser, type: "costmap_2d::ObstacleLayer"}
  - {name: inflation, type: "costmap_2d::InflationLayer"}
